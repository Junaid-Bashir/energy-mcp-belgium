name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-pypi-0.1.0
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'Junaid-Bashir/energy-mcp-belgium' &&
      github.event.release.tag_name == 'v0.1.0' &&
      !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify release identity, frozen runtime and exact-commit CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          git diff --exit-code 1138ac06d6cb1539432053376ac7a830615b153c HEAD -- src/
          python - <<'PY'
          import json, os, subprocess, tomllib, urllib.request
          from pathlib import Path
          p = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert p['name'] == 'energy-mcp-belgium' and p['version'] == '0.1.0'
          assert p['scripts'] == {'energy-mcp-belgium': 'energy_mcp_belgium.server:main'}
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          url = 'https://api.github.com/repos/Junaid-Bashir/energy-mcp-belgium/actions/workflows/ci.yml/runs?head_sha=' + sha
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response)['workflow_runs']
          assert any(r['head_sha'] == sha and r['event'] == 'push' and r['head_branch'] == 'main' and r['conclusion'] == 'success' for r in runs), 'Exact release commit must pass hosted CI'
          print('Approved identity, frozen runtime and successful exact-commit CI verified:', sha)
          PY
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python examples/check_docs.py
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python examples/verify_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/energy-mcp-belgium/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://upload.pypi.org/legacy/
